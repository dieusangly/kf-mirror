  <text x="36" y="80" class="subheading">Shared source records, then independent claims and summaries · exact evidence preserved</text>
  <text x="36" y="116" class="section">SHARED PIPELINE · STRUCTURAL CHUNK AND SEMANTIC CLUSTER BUILD</text>
