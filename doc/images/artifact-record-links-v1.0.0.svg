<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560" role="img" aria-labelledby="title description">
  <title id="title">Knowledge Foundry record lineage</title>
  <desc id="description">An example path links Source, Document, Element, Chunk, Claim, and Topic records. Chunk and Claim evidence cite source and document IDs plus an element ID and revision. A Build names input documents and output chunks, claims, and topics. A stage can contain many records.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#61758c"/>
    </marker>
    <marker id="cite-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#986c29"/>
    </marker>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", sans-serif; fill: #24364c; }
    .heading { font-size: 32px; font-weight: 700; fill: #172b4d; }
    .subheading { font-size: 18px; fill: #42526e; }
    .card-title { font-size: 23px; font-weight: 700; fill: #172b4d; }
    .id { font-family: "DejaVu Sans Mono", monospace; font-size: 18px; font-weight: 700; fill: #0747a6; }
    .card-copy { font-size: 17px; }
    .panel-title { font-size: 22px; font-weight: 700; fill: #172b4d; }
    .panel-copy { font-size: 18px; }
    .flow { fill: none; stroke: #61758c; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <rect width="1320" height="560" fill="#f6f8fc"/>
  <text x="35" y="51" class="heading">Record lineage</text>
  <text x="35" y="82" class="subheading">Artifact schema v1.0.0 · one possible path through the records</text>

  <path d="M210 210 H242" class="flow"/>
  <path d="M425 210 H457" class="flow"/>
  <path d="M640 210 H672" class="flow"/>
  <path d="M855 210 H887" class="flow"/>
  <path d="M1070 210 H1102" class="flow"/>

  <g transform="translate(35 130)">
    <rect width="175" height="160" rx="12" fill="#fff" stroke="#3a77ae" stroke-width="2"/>
    <text x="17" y="40" class="card-title">Source</text>
    <text x="17" y="73" class="id">src:…</text>
    <text x="17" y="111" class="card-copy">Publisher item</text>
    <text x="17" y="137" class="card-copy">+ version</text>
  </g>
  <g transform="translate(250 130)">
    <rect width="175" height="160" rx="12" fill="#fff" stroke="#4c8fae" stroke-width="2"/>
    <text x="17" y="40" class="card-title">Document</text>
    <text x="17" y="73" class="id">doc:…</text>
    <text x="17" y="111" class="card-copy">Saved file</text>
    <text x="17" y="137" class="card-copy">+ byte hash</text>
  </g>
  <g transform="translate(465 130)">
    <rect width="175" height="160" rx="12" fill="#fff" stroke="#5a9b88" stroke-width="2"/>
    <text x="17" y="40" class="card-title">Element</text>
    <text x="17" y="73" class="id">el:…</text>
    <text x="17" y="111" class="card-copy">Parsed unit</text>
    <text x="17" y="137" class="card-copy">+ location</text>
  </g>
  <g transform="translate(680 130)">
    <rect width="175" height="160" rx="12" fill="#fff" stroke="#7b9b53" stroke-width="2"/>
    <text x="17" y="40" class="card-title">Chunk</text>
    <text x="17" y="73" class="id">chunk:…</text>
    <text x="17" y="111" class="card-copy">Retrieval text</text>
    <text x="17" y="137" class="card-copy">+ evidence</text>
  </g>
  <g transform="translate(895 130)">
    <rect width="175" height="160" rx="12" fill="#fff" stroke="#a98452" stroke-width="2"/>
    <text x="17" y="40" class="card-title">Claim</text>
    <text x="17" y="73" class="id">claim:…</text>
    <text x="17" y="111" class="card-copy">Supported</text>
    <text x="17" y="137" class="card-copy">statement</text>
  </g>
  <g transform="translate(1110 130)">
    <rect width="175" height="160" rx="12" fill="#fff" stroke="#8869aa" stroke-width="2"/>
    <text x="17" y="40" class="card-title">Topic</text>
    <text x="17" y="73" class="id">topic:…</text>
    <text x="17" y="111" class="card-copy">Claim group</text>
    <text x="17" y="137" class="card-copy">+ summary</text>
  </g>

  <rect x="35" y="335" width="610" height="170" rx="12" fill="#fff" stroke="#b58b46" stroke-width="2"/>
  <text x="60" y="374" class="panel-title">Evidence links</text>
  <text x="60" y="429" class="panel-copy">Chunk / Claim evidence</text>
  <path d="M287 423 H337" fill="none" stroke="#986c29" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#cite-arrow)"/>
  <text x="351" y="412" class="panel-copy">Source + Document IDs</text>
  <text x="351" y="442" class="panel-copy">Element ID + revision</text>

  <rect x="675" y="335" width="610" height="170" rx="12" fill="#eaf0fa" stroke="#6d85ab" stroke-width="2"/>
  <text x="700" y="374" class="panel-title">Build</text>
  <text x="772" y="374" class="id">build:…</text>
  <text x="700" y="421" class="panel-copy">input_document_ids → Document</text>
  <text x="700" y="463" class="panel-copy">output_*_ids → Chunk · Claim · Topic</text>

  <text x="35" y="541" class="subheading">Each link may involve multiple records. See the schema guide for exact fields and ID formulas.</text>
</svg>
