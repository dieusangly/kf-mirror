    <text x="16" y="91" class="id">doc:…</text>
    <text x="16" y="125" class="card-copy">Saved file + hash</text>
  </g>
  <path d="M446 226 H472" class="flow" />
  <g transform="translate(476 136)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#5a9b88" stroke-width="2" />
    <text x="16" y="33" class="card-title">Element</text>
    <text x="16" y="91" class="id">el:…</text>
    <text x="16" y="125" class="card-copy">Text + location</text>
  </g>
  <path d="M666 226 H692" class="flow" />
  <g transform="translate(696 136)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#7b9b53" stroke-width="2" />
    <text x="16" y="33" class="card-title">Original</text>
    <text x="16" y="60" class="card-title">chunks</text>
    <text x="16" y="91" class="id">chunk:…</text>
    <text x="16" y="125" class="card-copy">Immutable records</text>
    <text x="16" y="149" class="card-copy">Exact evidence</text>
  </g>
  <path d="M886 226 H912" class="flow" />
  <g transform="translate(916 136)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#388a70" stroke-width="2" stroke-dasharray="7 5" />
    <text x="16" y="33" class="card-title">Structural</text>
    <text x="16" y="60" class="card-title">chunks</text>
    <text x="16" y="91" class="id">structural:…</text>
