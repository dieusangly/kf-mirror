<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="940" viewBox="0 0 1360 940" role="img" aria-labelledby="title description">
  <title id="title">Knowledge Foundry pipeline and record lineage</title>
  <desc id="description">Saved Source, Document and Element records provide immutable original chunks. Structural chunks assemble original chunks within a document using structural links. Embeddings support numerical semantic clustering across documents. Each final semantic cluster produces zero, one or multiple candidate claims. Topic classification preserves claim text and evidence; unclassified candidate claims remain available. Canonical Build records track input documents and output chunks, claims and topics. A separate frozen build stores structural memberships, vectors, semantic clusters, token budgets and integrity hashes. E labels retain citable evidence text; C labels provide non-citable context. Source review assesses fidelity, completeness and topic choices. Exact source provenance is retained throughout.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#61758c"/>
    </marker>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", sans-serif; fill: #24364c; }
    .heading { font-size: 30px; font-weight: 700; fill: #172b4d; }
    .subheading { font-size: 17px; fill: #42526e; }
    .section { font-size: 13px; font-weight: 700; letter-spacing: 1.1px; fill: #42526e; }
    .card-title { font-size: 22px; font-weight: 700; fill: #172b4d; }
    .id { font-family: "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 700; fill: #0747a6; }
    .card-copy { font-size: 15px; }
    .panel-title { font-size: 22px; font-weight: 700; fill: #172b4d; }
    .panel-copy { font-size: 16px; }
    .flow { fill: none; stroke: #61758c; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <rect width="1360" height="940" fill="#f6f8fc"/>
  <text x="36" y="50" class="heading">Knowledge Foundry pipeline</text>
  <text x="36" y="80" class="subheading">Canonical records and derived artifacts · original text and exact evidence preserved</text>
  <text x="36" y="116" class="section">INGESTION → PARSING → ORIGINAL CHUNKING</text>
  <g transform="translate(36 136)">
    <rect width="190" height="130" rx="12" fill="#fff" stroke="#3a77ae" stroke-width="2"/>
  <text x="16" y="33" class="card-title">Source</text>
  <text x="16" y="68" class="id">src:…</text>
  <text x="16" y="101" class="card-copy">Publisher + edition</text>
  </g>
  <g transform="translate(256 136)">
    <rect width="190" height="130" rx="12" fill="#fff" stroke="#4c8fae" stroke-width="2"/>
  <text x="16" y="33" class="card-title">Document</text>
  <text x="16" y="68" class="id">doc:…</text>
  <text x="16" y="101" class="card-copy">Saved file + hash</text>
  </g>
  <g transform="translate(476 136)">
    <rect width="190" height="130" rx="12" fill="#fff" stroke="#5a9b88" stroke-width="2"/>
  <text x="16" y="33" class="card-title">Element</text>
  <text x="16" y="68" class="id">el:…</text>
  <text x="16" y="101" class="card-copy">Text + location</text>
  </g>
  <path d="M226 201 H252" class="flow"/>
  <path d="M446 201 H472" class="flow"/>
  <text x="716" y="172" class="panel-title">Preserve source structure and evidence</text>
  <text x="716" y="204" class="panel-copy">Parse text, tables and locations; review saved sources.</text>
  <text x="716" y="235" class="panel-copy">Downstream stages preserve original IDs, text and spans.</text>
  <path d="M571 266 V298 H18 V461 H32" class="flow"/>
  <text x="716" y="302" class="subheading">Claims and topic views remain drafts until reviewed.</text>
  <text x="36" y="344" class="section">STRUCTURAL ASSEMBLY → SEMANTIC CLUSTERING → CLAIM GENERATION → TOPIC CLASSIFICATION</text>
  <g transform="translate(36 376)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#7b9b53" stroke-width="2"/>
  <text x="16" y="33" class="card-title">Original</text>
  <text x="16" y="60" class="card-title">chunks</text>
  <text x="16" y="91" class="id">chunk:…</text>
  <text x="16" y="125" class="card-copy">Immutable records</text>
  <text x="16" y="149" class="card-copy">Exact evidence</text>
  </g>
  <g transform="translate(256 376)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#388a70" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="16" y="33" class="card-title">Structural</text>
  <text x="16" y="60" class="card-title">chunks</text>
  <text x="16" y="91" class="id">structural:…</text>
  <text x="16" y="125" class="card-copy">Within one document</text>
  <text x="16" y="149" class="card-copy">Structural links</text>
  </g>
  <g transform="translate(476 376)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#6978b5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="16" y="33" class="card-title">Semantic</text>
  <text x="16" y="60" class="card-title">clusters</text>
  <text x="16" y="91" class="id">semantic:…</text>
  <text x="16" y="125" class="card-copy">Embedding similarity</text>
  <text x="16" y="149" class="card-copy">Across documents</text>
  </g>
  <g transform="translate(696 376)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#b58b46" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="16" y="33" class="card-title">Candidate</text>
  <text x="16" y="60" class="card-title">claims</text>
  <text x="16" y="91" class="id">candidate:…</text>
  <text x="16" y="125" class="card-copy">Atomic propositions</text>
  <text x="16" y="149" class="card-copy">Exact citations</text>
  </g>
  <g transform="translate(916 376)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#a98452" stroke-width="2"/>
  <text x="16" y="33" class="card-title">Classified</text>
  <text x="16" y="60" class="card-title">claims</text>
  <text x="16" y="91" class="id">claim:…</text>
  <text x="16" y="125" class="card-copy">Text + evidence kept</text>
  <text x="16" y="149" class="card-copy">Topic assigned</text>
  </g>
  <g transform="translate(1136 376)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#8869aa" stroke-width="2"/>
  <text x="16" y="33" class="card-title">Topics</text>
  <text x="16" y="91" class="id">topic:…</text>
  <text x="16" y="125" class="card-copy">Curated classification</text>
  <text x="16" y="149" class="card-copy">Claim membership</text>
  </g>
  <path d="M226 461 H252" class="flow"/>
  <path d="M446 461 H472" class="flow"/>
  <path d="M666 461 H692" class="flow"/>
  <path d="M886 461 H912" class="flow"/>
  <path d="M1106 461 H1132" class="flow"/>
  <text x="36" y="586" class="subheading">Generation processes each final semantic cluster → zero, one or multiple candidate claims; retries may add calls.</text>
  <text x="36" y="614" class="subheading">Classification preserves text and evidence; unclassified candidate claims remain available.</text>
  <rect x="36" y="646" width="630" height="156" rx="12" fill="#fff" stroke="#6d85ab" stroke-width="2"/>
  <rect x="696" y="646" width="630" height="156" rx="12" fill="#fff" stroke="#b58b46" stroke-width="2"/>
  <text x="56" y="683" class="panel-title">Frozen structural chunks and semantic clusters</text>
  <text x="56" y="718" class="panel-copy">Structural links → embeddings → numerical clustering</text>
  <text x="56" y="748" class="panel-copy">Unique membership · vectors · request budgets · hashes</text>
  <text x="56" y="778" class="panel-copy">Oversized clusters are refined; structural chunks stay whole.</text>
  <text x="716" y="683" class="panel-title">Exact source provenance</text>
  <text x="716" y="718" class="panel-copy">Candidate claims and claims retain original chunk IDs.</text>
  <text x="716" y="748" class="panel-copy">Evidence cites source, document and element ID + revision.</text>
  <text x="716" y="778" class="panel-copy">Character span [start, end): zero-based, end exclusive.</text>
  <rect x="36" y="824" width="1290" height="65" rx="12" fill="#eaf0fa" stroke="#6d85ab" stroke-width="2"/>
  <text x="56" y="864" class="panel-title">Build records</text>
  <text x="248" y="864" class="id">build:…</text>
  <text x="370" y="864" class="panel-copy">Input documents → output original chunks, claims and topics (by stage)</text>
  <text x="36" y="923" class="subheading">Solid border: canonical bundle record · Dashed border: derived artifact or candidate claim · See schema guide for exact fields.</text>
</svg>
