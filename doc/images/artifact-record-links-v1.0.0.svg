  <text x="44" y="649" class="card-copy">Draft claims retain exact evidence through classification and review.</text>
  <text x="44" y="680" class="card-copy">Unclassified candidates remain available; source review is required.</text>
  <path d="M1231 604 V630 H1011 V608" class="flow" />
  <text x="925" y="655" class="card-copy">Repeat within similarity, budget and level limits</text>
  <text x="704" y="684" class="card-copy">Unmerged summaries carry forward; synthesis remains draft.</text>
  <rect x="36" y="740" width="630" height="156" rx="12" fill="#fff" stroke="#6d85ab" stroke-width="2" />
  <rect x="696" y="740" width="630" height="156" rx="12" fill="#fff" stroke="#b58b46" stroke-width="2" />
  <text x="56" y="777" class="panel-title">Frozen structural chunks and semantic clusters</text>
  <text x="56" y="812" class="panel-copy">Structural links → embeddings → numerical clustering</text>
  <text x="56" y="842" class="panel-copy">Unique membership · vectors · request budgets · hashes</text>
  <text x="56" y="872" class="panel-copy">Oversized clusters are refined; structural chunks stay whole.</text>
  <text x="716" y="777" class="panel-title">Exact source provenance</text>
  <text x="716" y="812" class="panel-copy">Claims and summaries retain original chunk IDs.</text>
  <text x="716" y="842" class="panel-copy">Evidence cites source, document and element ID + revision.</text>
  <text x="716" y="872" class="panel-copy">Character span [start, end): zero-based, end exclusive.</text>
  <rect x="36" y="918" width="1290" height="65" rx="12" fill="#eaf0fa" stroke="#6d85ab" stroke-width="2" />
  <text x="56" y="958" class="panel-title">Build records</text>
  <text x="248" y="958" class="id">build:…</text>
  <text x="370" y="958" class="panel-copy">Input documents → output original chunks, claims and topics (by stage)</text>
  <text x="36" y="1013" class="card-copy">E labels: citable evidence · C labels: non-citable governing context · Source review checks fidelity and completeness.</text>
  <text x="36" y="1043" class="card-copy">Solid border: canonical bundle record · Dashed border: derived artifact or candidate claim · See schema guide for exact fields.</text>
</svg>
