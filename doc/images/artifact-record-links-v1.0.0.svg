    <text x="16" y="33" class="card-title">Classified</text>
    <text x="16" y="60" class="card-title">claims</text>
    <text x="16" y="91" class="id">claim:…</text>
    <text x="16" y="125" class="card-copy">Text + evidence kept</text>
    <text x="16" y="149" class="card-copy">Topic assigned</text>
  </g>
  <path d="M446 514 H472" class="flow" />
  <g transform="translate(476 424)">
