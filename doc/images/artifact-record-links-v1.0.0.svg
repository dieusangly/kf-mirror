<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060" role="img" aria-labelledby="title description">
  <title id="title">Knowledge Foundry pipeline and record lineage</title>
  <desc id="description">The first six records run left to right across the shared pipeline, then semantic clusters branch into independent claims and summaries below. Saved Source, Document and Element records provide immutable original chunks. Structural chunks assemble original chunks within a document using structural links. Embeddings support numerical semantic clustering across documents. Each final semantic cluster independently produces candidate claims and a level-one summary. Earlier summaries are clustered and summarized recursively with complete source lineage. Element hierarchy records retain section and numbered-paragraph parents across focused structural chunks. Topic classification preserves claim text and evidence; unclassified candidate claims remain available. Canonical Build records track input documents and output chunks, claims and topics. A separate frozen build stores structural memberships, vectors, semantic clusters, token budgets and integrity hashes. E labels retain citable evidence text; C labels provide non-citable context. Source review assesses fidelity, completeness and topic choices. Exact source provenance is retained throughout.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#61758c" />
    </marker>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", sans-serif; fill: #24364c; }
    .heading { font-size: 30px; font-weight: 700; fill: #172b4d; }
    .subheading { font-size: 17px; fill: #42526e; }
    .section { font-size: 13px; font-weight: 700; letter-spacing: 1.1px; fill: #42526e; }
    .card-title { font-size: 22px; font-weight: 700; fill: #172b4d; }
    .id { font-family: "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 700; fill: #0747a6; }
    .card-copy { font-size: 14px; }
    .panel-title { font-size: 22px; font-weight: 700; fill: #172b4d; }
    .panel-copy { font-size: 16px; }
    .flow { fill: none; stroke: #61758c; stroke-width: 2.5; marker-end: url(#arrow); }
      .connector { fill: none; stroke: #61758c; stroke-width: 2.5; }
  </style>
  <rect width="1360" height="1060" fill="#f6f8fc" />
