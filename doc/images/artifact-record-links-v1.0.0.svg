    <text x="16" y="91" class="id">semantic:…</text>
    <text x="16" y="125" class="card-copy">Embedding similarity</text>
    <text x="16" y="149" class="card-copy">Across documents</text>
  </g>
  <path d="M1231 316 V354 H131" class="connector" />
  <path d="M131 354 V382" class="connector" />
  <circle cx="131" cy="354" r="4" fill="#61758c" />
  <path d="M791 354 V382" class="connector" />
  <circle cx="791" cy="354" r="4" fill="#61758c" />
  <rect x="24" y="382" width="654" height="330" rx="12" fill="#fbf7f0" stroke="#eadcc8" stroke-width="2" />
  <rect x="684" y="382" width="654" height="330" rx="12" fill="#f1f7f5" stroke="#d1e4db" stroke-width="2" />
