    <text x="16" y="125" class="card-copy">Curated classification</text>
    <text x="16" y="149" class="card-copy">Claim membership</text>
  </g>
  <g transform="translate(696 424)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#388a70" stroke-width="2" stroke-dasharray="7 5" />
