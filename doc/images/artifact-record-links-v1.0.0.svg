    <text x="16" y="60" class="card-title">summaries</text>
    <text x="16" y="91" class="id">summary:…</text>
    <text x="16" y="125" class="card-copy">One per cluster</text>
    <text x="16" y="149" class="card-copy">No claims required</text>
  </g>
  <path d="M886 514 H912" class="flow" />
  <g transform="translate(916 424)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#6978b5" stroke-width="2" stroke-dasharray="7 5" />
    <text x="16" y="33" class="card-title">Clusters of</text>
    <text x="16" y="60" class="card-title">summaries</text>
    <text x="16" y="91" class="id">summary-cluster:…</text>
    <text x="16" y="125" class="card-copy">Summary embeddings</text>
    <text x="16" y="149" class="card-copy">All-members similarity</text>
  </g>
  <path d="M1106 514 H1132" class="flow" />
  <g transform="translate(1136 424)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#388a70" stroke-width="2" stroke-dasharray="7 5" />
    <text x="16" y="33" class="card-title">Higher-level</text>
    <text x="16" y="60" class="card-title">summaries</text>
    <text x="16" y="91" class="id">summary:…</text>
    <text x="16" y="125" class="card-copy">Prior summary inputs</text>
    <text x="16" y="149" class="card-copy">Source lineage kept</text>
