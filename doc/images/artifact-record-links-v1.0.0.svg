  <text x="815" y="407" class="section">SUMMARIES</text>
  <g transform="translate(36 424)">
    <rect width="190" height="180" rx="12" fill="#fff" stroke="#b58b46" stroke-width="2" stroke-dasharray="7 5" />
    <text x="16" y="33" class="card-title">Candidate</text>
    <text x="16" y="60" class="card-title">claims</text>
    <text x="16" y="91" class="id">candidate:…</text>
    <text x="16" y="125" class="card-copy">Atomic propositions</text>
    <text x="16" y="149" class="card-copy">Exact citations</text>
  </g>
  <path d="M226 514 H252" class="flow" />
  <g transform="translate(256 424)">
