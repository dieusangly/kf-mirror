<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>__STYLES__</style>
</head>
<body>
<header>
  <div><p class="eyebrow">KNOWLEDGE FOUNDRY</p><h1>__TITLE__</h1></div>
  <p class="header-note">Explore claims and summaries, then follow their provenance to saved sources.</p>
</header>
<main id="main-layout">
  <section class="workspace" aria-label="Knowledge provenance graph">
    <div class="toolbar">
      <label>View<select id="view-mode"><option value="topic">Topics and claims</option><option value="summaries">Summaries</option><option value="claim">Selected record provenance</option><option value="document">Document-derived knowledge</option><option value="full">Full graph / debug</option></select></label>
      <label>Topic<select id="topic-filter"></select></label>
      <label>Document<select id="document-filter"></select></label>
      <details class="advanced-filters">
        <summary>More filters</summary>
        <div class="advanced-filter-controls">
          <label>Build<select id="build-filter"></select></label>
          <label>Review<select id="review-filter"></select></label>
          <label>Node type<select id="type-filter"></select></label>
        </div>
      </details>
    </div>
    <div class="graph-heading"><div><h2 id="view-title">Topics and claims</h2><p id="view-summary" class="muted"></p></div><div id="pager" class="pager"></div></div>
    <div class="canvas"><svg id="graph" role="img" aria-label="Interactive knowledge provenance graph"></svg></div>
    <p class="legend"><span><i class="line"></i>record link</span><span><i class="line dashed"></i>direct evidence</span><span id="visible-count"></span></p>
  </section>
  <aside id="detail">
    <button id="detail-toggle" class="detail-toggle" type="button" aria-expanded="true" aria-controls="detail-content">Hide details</button>
    <div id="detail-content" aria-live="polite"><h2>Choose a record</h2><p class="muted">Select a topic, claim, or provenance node to inspect its saved details.</p></div>
  </aside>
</main>
<script>__SCRIPT__</script>
</body>
</html>
