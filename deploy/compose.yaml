services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_foundry}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_foundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:${KF_POSTGRES_PORT:-55432}:5432"
    volumes:
      - knowledge_foundry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  knowledge_foundry_pgdata:
